<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анжела ❤️ // Детектив в Пангодах</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffc0cb;
            color: #4a4a4a;
            font-family: 'Comic Sans MS', 'Trebuchet MS', monospace;
            overflow: hidden; user-select: none;
            background-image: radial-gradient(#ffb6c1 20%, transparent 20%), radial-gradient(#ffb6c1 20%, transparent 20%);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
        }

        #app {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100dvh; width: 100vw; padding: 2vh 0; box-sizing: border-box;
        }

        #game-container {
            width: 95%; max-width: 800px; height: 100%;
            display: flex; flex-direction: column;
            background: rgba(255, 255, 255, 0.95); 
            border: 4px solid #ff69b4;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
            position: relative; z-index: 10;
        }

        .header-status {
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid #ff69b4;
            padding: 15px 20px; font-size: 18px; font-weight: bold;
            background: #fff0f5; flex-shrink: 0;
            border-radius: 11px 11px 0 0;
            color: #ff1493;
        }

        .inv-btn-header {
            background: #ff69b4; color: white; border: none;
            cursor: pointer; padding: 8px 15px; font-family: inherit; font-size: 15px;
            border-radius: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(255,20,147,0.3);
            transition: 0.2s;
        }
        .inv-btn-header:hover { background: #ff1493; transform: scale(1.05); }

        .art-container {
            flex: 0 0 250px; display: flex; justify-content: center; align-items: center;
            border-bottom: 3px dashed #ffb6c1; background: #ffe4e1;
            overflow: hidden; padding: 10px; position: relative;
        }

        .art-image {
            max-width: 100%; max-height: 100%; object-fit: contain;
            border-radius: 10px; border: 2px solid #ffb6c1;
        }

        .content-area {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; padding: 20px; gap: 15px; position: relative;
        }

        .text-box {
            flex: 1; overflow-y: auto; font-size: 18px; line-height: 1.6;
            padding-right: 15px; color: #333; font-weight: 500;
            padding-bottom: 20px;
        }
        
        .text-box::-webkit-scrollbar { width: 8px; }
        .text-box::-webkit-scrollbar-track { background: #fff0f5; border-radius: 4px; }
        .text-box::-webkit-scrollbar-thumb { background: #ff69b4; border-radius: 4px; }

        .choices {
            flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;
            padding-top: 15px; border-top: 2px solid #ffb6c1;
        }

        .choice-btn {
            background: white; color: #ff1493; border: 2px solid #ffb6c1;
            padding: 12px 20px; font-family: inherit;
            font-size: 16px; cursor: pointer; text-align: left;
            transition: all 0.2s ease; border-radius: 8px; font-weight: bold;
        }

        .choice-btn:hover { 
            background: #fff0f5; border-color: #ff69b4;
            transform: translateX(5px); box-shadow: 0 4px 10px rgba(255,105,180,0.2);
        }

        #init-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffc0cb; display: flex; justify-content: center; align-items: center;
            z-index: 1000; flex-direction: column; text-align: center; padding: 20px; box-sizing: border-box;
            background-image: radial-gradient(#ffb6c1 20%, transparent 20%), radial-gradient(#ffb6c1 20%, transparent 20%);
            background-position: 0 0, 20px 20px; background-size: 40px 40px;
        }

        .init-btn {
            margin-top: 40px; padding: 15px 50px; font-size: 24px; color: white; background: #ff69b4;
            border: none; border-radius: 30px; cursor: pointer; font-family: inherit;
            font-weight: bold; transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }
        .init-btn:hover { background: #ff1493; transform: scale(1.05); }

        #audio-status { position: absolute; top: 10px; left: 10px; font-size: 14px; color: #ff1493; z-index: 100; font-weight: bold; background: white; padding: 5px 10px; border-radius: 10px; border: 2px solid #ffb6c1;}
        
        #inventory-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 400px; background: white;
            border: 4px solid #ff69b4; border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 3000; padding: 25px; display: none;
            color: #333; font-family: inherit;
        }
        #inventory-modal h2 { color: #ff1493; margin-top: 0; text-align: center; border-bottom: 2px dashed #ffb6c1; padding-bottom: 10px;}
        #inventory-modal ul { list-style: none; padding: 0; }
        #inventory-modal li { margin-bottom: 15px; padding-bottom: 10px; line-height: 1.5; font-size: 16px; border-bottom: 1px solid #fff0f5;}
        .close-inv-btn { 
            background: #ff69b4; color: white; border: none; border-radius: 8px;
            padding: 12px; width: 100%; cursor: pointer; font-family: inherit; font-weight: bold;
            font-size: 16px; margin-top: 10px; transition: 0.2s;
        }
        .close-inv-btn:hover { background: #ff1493; }

        .name-tag {
            color: #ff1493; font-weight: bold;
        }

        @media (max-width: 768px) {
            #app { padding: 0; }
            #game-container { width: 100%; height: 100dvh; border-radius: 0; border: none; }
            .header-status { border-radius: 0; }
            .art-container { flex: 0 0 200px; }
            .text-box { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="audio-status">МУЗЫКА: ВЫКЛ</div>

    <div id="init-screen">
        <h1 style="color: #ff1493; font-size: 40px; margin-bottom: 10px; text-shadow: 2px 2px 0px white;">АНЖЕЛА ❤️</h1>
        <h3 style="color: #ff69b4; font-size: 20px; background: white; padding: 5px 15px; border-radius: 15px; border: 2px solid #ffb6c1;">Загадка пропавшего ТГ-Премиума</h3>
        <button class="init-btn" onclick="startGame()">ИГРАТЬ</button>
    </div>

    <div id="inventory-modal">
        <h2>Моя сумочка 👜</h2>
        <ul id="inventory-list">
            <li>🎸 <b>Электрогитара</b> <br><small>Оплачена на год за 1060 руб.</small></li>
            <li>💊 <b>Секретные белые капсулы</b> <br><small>Для внимания. Главное не перепутать.</small></li>
            <li>📱 <b>Телефон с ВК</b> <br><small>Где уведомления постоянно перекидывают в мессенджер.</small></li>
        </ul>
        <button class="close-inv-btn" onclick="toggleInventory()">Закрыть</button>
    </div>

    <div id="app">
        <div id="game-container" style="display: none;">
            <div class="header-status">
                <span id="loc-display">ЛОКАЦИЯ: ???</span>
                <button class="inv-btn-header" onclick="toggleInventory()">Сумочка 👜</button>
            </div>
            
            <div class="art-container" id="art">
                <img id="scene-image" class="art-image" src="" alt="Сцена" style="display: none;">
                <div id="art-placeholder" style="color: #ffb6c1; font-size: 18px; font-weight: bold; text-align: center; padding: 20px;"></div>
            </div>
            
            <div class="content-area">
                <div class="text-box" id="text"></div>
                <div class="choices" id="choices"></div>
            </div>
        </div>
    </div>

<script>
    let currentBGM = null;
    let audioPlayer = new Audio();
    audioPlayer.loop = true;

    // ВНИМАНИЕ: Здесь прописаны пути!
    const scenes = {
        start: {
            bgm: 'audio/menu.mp3',
            loc: 'Главное Меню', 
            image: 'img/start_screen.jpg',
            text: [
                "Добро пожаловать в Пангоды.",
                "Место, где зимой холодно, а летом распускают тупые слухи.",
                "Ты — Анжела, и твоя цель сегодня — выжить в школе и найти крысу, которая сливает фотки в ТГ-канал «Пангоды любят»."
            ],
            choices: [
                { text: "Начать день", next: 'class_bio' }
            ]
        },
        class_bio: {
            bgm: 'audio/school.mp3',
            loc: 'Урок Обществознания', 
            image: 'img/class.jpg',
            text: [
                "Ты сидишь на своей любимой одиночной парте третьего ряда.",
                "Учительница диктует вопросы по экономике: «К расходной части государственного бюджета относится...»",
                "Тебе абсолютно <span class='name-tag'>индифферентно</span>. Куда важнее то, что в ТГ-канале появились новые посты с фотками одноклассников.",
                "Телефон вибрирует. Пишет Саша (Рафаэль Амброзиус Кусто):",
                "<i>«СРОЧНО! Встречаемся на крыше шестиэтажки. Я нашел улику на пикми-Марселя!»</i>"
            ],
            choices: [
                { text: "Сбежать с урока на крышу", next: 'roof' },
                { text: "Спрятаться в туалете и подумать", next: 'toilet' }
            ]
        },
        roof: {
            bgm: 'audio/suspense.mp3',
            loc: 'Крыша шестиэтажки',
            image: 'img/roof.jpg',
            text: [
                "Ты поднимаешься на самый верх шестиэтажки.",
                "Естественно, на двери висит огромный ржавый замок. Саша стоит рядом с каменным лицом.",
                "<span class='name-tag'>Саша:</span> «Я забыл про замок. Но я знаю, кто сливает инфу. Это...»",
                "Не успевает он договорить, как снизу, с лестничной клетки, раздаются шаги и знакомый голос."
            ],
            choices: [
                { text: "Затаиться и подслушать", next: 'eavesdrop' }
            ]
        },
        toilet: {
            bgm: 'audio/chill.mp3',
            loc: 'Женский туалет',
            image: 'img/toilet.jpg',
            text: [
                "Ты заходишь в туалет. Как обычно, накурено так, что пахнет сигами деда. Дышать невозможно.",
                "Из кабинки выходит Даша. У нее в телефоне открыта фотка кошки с огромными ушами.",
                "<span class='name-tag'>Даша:</span> «О, Анжела! Представляешь, опять в 'Пангоды любят' кого-то слили...»",
                "Она выглядит подозрительно нервной. Или это потому, что вы когда-то нахуярились в гараже?"
            ],
            choices: [
                { text: "Спросить в лоб про ТГ-канал", next: 'dasha_interrogate' }
            ]
        },
        eavesdrop: {
             bgm: 'audio/suspense.mp3',
            loc: 'Лестница шестиэтажки',
            image: 'img/maxim.jpg',
            text: [
                 "Вы с Сашей заглядываете вниз. Там стоит Максим — 160-сантиметровый офник со штрихкод-челкой.",
                 "Он громко говорит по телефону:",
                 "<span class='name-tag'>Максим:</span> «Да, я все фотки админу скинул! Пусть все знают, какие они нормисы!»",
                 "Саша яростно шепчет: «Я так и знал, что это этот бабуин!»"
            ],
             choices: [
                { text: "Кинуть в него Bluetooth-адаптером Саши", next: 'throw_bt' },
                { text: "Достать телефон и снять видео", next: 'record_video' }
            ]
        },
        dasha_interrogate: {
            bgm: 'audio/chill.mp3',
            loc: 'Женский туалет',
            image: 'img/dasha.jpg',
            text: [
                "<span class='name-tag'>Ты:</span> «Слушай, Даш, ты не в курсе, кто канал ведет?»",
                "Даша мнется, пряча глаза:",
                "<span class='name-tag'>Даша:</span> «Ну... Сава там теперь админ. Тот, который друг Саши. Но он сам в шоке от сливов, говорит, кто-то другой в предложку спамит.»",
                "Кажется, нужно допросить Савелия."
            ],
            choices: [
                 { text: "Написать Савелию в ВК", next: 'message_sava' }
            ]
        },
         throw_bt: {
            bgm: 'audio/victory.mp3',
            loc: 'Лестница',
            image: 'img/bt_hit.jpg',
            text: [
                "Ты выхватываешь у Саши из кармана Bluetooth 4.0 адаптер от Logitech и с силой кидаешь вниз.",
                "Попадание! Адаптер отскакивает от лба Максима, он пугается и роняет свой пафосный телефон прямо в лестничный пролет.",
                "<span class='name-tag'>Саша:</span> «Ахуеть... Мой адаптер... Но оно того стоило.»",
                "Справедливость восторжествовала. Вы с Сашей идете обсуждать новеллы про каннибалов."
            ],
            choices: [
                { text: "Конец (Победа Силой)", next: 'start' }
            ]
        },
        record_video: {
            bgm: 'audio/victory.mp3',
            loc: 'Лестница',
            image: 'img/video_proof.jpg',
            text: [
                "Ты достаешь телефон и аккуратно снимаешь на видео признание Максима.",
                "Ты отправляешь видео напрямую админу Савелию.",
                "Через 5 минут канал очищен от клеветы, а Максима блокируют. Ты идеальный нейтральный чувачок, который решил проблему без шума.",
                "<span class='name-tag'>Саша:</span> «Гениально. Почти так же круто, как резать аппендикс.»"
            ],
             choices: [
                { text: "Конец (Победа Интеллектом)", next: 'start' }
            ]
        },
         message_sava: {
            bgm: 'audio/victory.mp3',
            loc: 'Коридор школы',
            image: 'img/sava_chat.jpg',
            text: [
                 "Ты пишешь Савелию. Сообщения долго грузятся из-за ВК мессенджера.",
                 "Наконец он отвечает:",
                 "<span class='name-tag'>Сава:</span> «Блин, я уже удалил сливы. Оказалось, это Марсель с твинка кидал. Я его забанил.»",
                 "Дело раскрыто, даже не успев начаться. Теперь можно спокойно пойти домой и поспать."
            ],
             choices: [
                { text: "Конец (Победа Нейтралитета)", next: 'start' }
            ]
        }
    };

    function initAudio() {
        document.getElementById('audio-status').innerText = 'МУЗЫКА: ВКЛ';
    }

    function playBGM(trackPath) {
        if (!trackPath) {
            audioPlayer.pause();
            return;
        }
        if (currentBGM === trackPath) return;
        currentBGM = trackPath;
        audioPlayer.src = trackPath;
        audioPlayer.play().catch(e => {
            console.log("Автоплей заблокирован до клика.");
        });
    }

    function toggleInventory() {
        const modal = document.getElementById('inventory-modal');
        modal.style.display = (modal.style.display === 'none' || modal.style.display === '') ? 'block' : 'none';
    }

    function startGame() {
        const screen = document.getElementById('init-screen');
        if (screen) screen.style.display = 'none';
        
        const container = document.getElementById('game-container');
        if (container) container.style.display = 'flex';
        
        initAudio();
        renderScene('start');
    }

    function renderScene(sceneId) {
        const scene = scenes[sceneId];
        document.getElementById('loc-display').innerText = 'ЛОКАЦИЯ: ' + scene.loc;
        
        if (scene.bgm) playBGM(scene.bgm);
        
        const imgElement = document.getElementById('scene-image');
        const placeholder = document.getElementById('art-placeholder');
        
        if (scene.image) {
            imgElement.src = scene.image;
            imgElement.style.display = 'block';
            placeholder.style.display = 'none';
            imgElement.onerror = function() {
                imgElement.style.display = 'none';
                placeholder.style.display = 'block';
                placeholder.innerHTML = "Нужно положить картинку:<br><span style='color: #ff1493;'>" + scene.image + "</span>";
            };
        } else {
            imgElement.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = "(Картинка не требуется)";
        }

        const choicesDiv = document.getElementById('choices');
        const textDiv = document.getElementById('text');
        choicesDiv.innerHTML = '';
        textDiv.innerHTML = '';

        scene.text.forEach(paragraph => {
            let pNode = document.createElement('p');
            pNode.style.margin = "0 0 15px 0";
            pNode.innerHTML = paragraph;
            textDiv.appendChild(pNode);
        });

        scene.choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerHTML = choice.text;
            btn.onclick = () => { 
                if (audioPlayer.paused && currentBGM) audioPlayer.play();
                renderScene(choice.next);
            };
            choicesDiv.appendChild(btn);
        });
        
        textDiv.scrollTop = 0;
    }
</script>
</body>
</html>
